services:
  douyin-spark-flow-single-user:
    image: ${SINGLE_USER_IMAGE:-ghcr.io/baroncmh/douyinsparkflow-single-user:latest}
    container_name: douyin-spark-flow-single-user
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      TZ: "Asia/Shanghai"
      PYTHONUNBUFFERED: "1"
      PANEL_HOST: "0.0.0.0"
      DSF_BASE_DIR: /app/single-user/runtime
      DSF_CONFIG_DIR: /app/single-user/data/config
      DSF_LOG_DIR: /app/single-user/data/logs
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - ./data/config:/app/single-user/data/config
      - ./data/logs:/app/single-user/data/logs
